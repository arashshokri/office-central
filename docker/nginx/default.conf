# This file is rendered by the official Nginx image's envsubst entrypoint.
map $http_x_forwarded_proto $office_forwarded_proto {
    default $scheme;
    https https;
    http http;
}
map $office_forwarded_proto $office_https { default off; https on; }
map $office_forwarded_proto $office_port { default 80; https 443; }
map $http_x_forwarded_for $office_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 1025m;
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ^~ /api/v1/packages/download/ {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
    location ^~ /api/v1/ {
        client_max_body_size 256k;
        try_files $uri /index.php?$query_string;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $office_forwarded_proto;
        fastcgi_param HTTPS $office_https;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        # Keep Laravel's trusted boundary on the private web IP, regardless of
        # which IP NPM uses on the shared network. Client IPs travel in XFF.
        fastcgi_param REMOTE_ADDR ${CENTRAL_WEB_IP};
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $office_port;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_param HTTP_X_FORWARDED_PROTO $office_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $office_port;
        # NPM already appends the real peer to XFF. Appending NPM's address
        # again would make Laravel report the proxy IP as the client.
        fastcgi_param HTTP_X_FORWARDED_FOR $office_forwarded_for;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 1800s;
        fastcgi_send_timeout 300s;
    }
    location ~ /\. { deny all; }
}
