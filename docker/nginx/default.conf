server { listen 80; server_name _; root /var/www/html/public; index index.php; client_max_body_size 1024m; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Frame-Options DENY always; location ^~ /api/v1/packages/download/ { access_log off; try_files $uri /index.php?$query_string; } location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTP_X_FORWARDED_PROTO $scheme; fastcgi_pass app:9000; } location ~ /\. { deny all; } }
