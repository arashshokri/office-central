name: office-central
services:
  app:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    env_file: .env
    restart: unless-stopped
    volumes: [application_storage:/var/www/html/storage, package_data:/srv/office-central/packages]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${INTERNAL_BIND_ADDRESS:-0.0.0.0}:${INTERNAL_HTTP_PORT:-8787}:80"]
    volumes: ["./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro", "./public:/var/www/html/public:ro"]
    depends_on: {app: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}
    networks:
      default: {ipv4_address: 172.29.87.20}
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: "${DB_DATABASE}", POSTGRES_USER: "${DB_USERNAME}", POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD}"}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
  queue-worker:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes: [application_storage:/var/www/html/storage, package_data:/srv/office-central/packages]
    depends_on: {app: {condition: service_healthy}}
  scheduler:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes: [application_storage:/var/www/html/storage, package_data:/srv/office-central/packages]
    depends_on: {app: {condition: service_healthy}}
volumes: {postgres_data: {}, redis_data: {}, package_data: {}, application_storage: {}}
networks:
  default:
    ipam:
      config: [{subnet: 172.29.87.0/24}]
